spring.application.name=JWT_springboot3
server.port=8005

# Encoding UTF-8 cho Web, Request & Response
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ========================================================
# 1. Cấu hình Microsoft SQL Server (Mặc định cho máy local)
# ========================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=jwt_springboot3;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ========================================================
# 2. Cấu hình MySQL (Theo đúng slide 21 bài giảng của Thầy Trung)
# Bỏ comment cụm dưới đây nếu chạy với MySQL trên cổng 3306:
# ========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=1234567@a$
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ========================================================
# Hibernate & JPA Properties
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# Cấu hình JWT (Nimbus JOSE + JWT)
# ========================================================
# Secret key 256-bit (64 hex characters) dùng cho HMAC SHA-256
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Thời hạn token: 1h in millisecond (3600000 ms)
security.jwt.expiration-time=3600000

# ========================================================
# Thymeleaf Configuration
# ========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
